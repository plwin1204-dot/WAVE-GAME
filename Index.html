<!DOCTYPE html>
<html>
<head>
    <title>My First Telegram Game</title>
    <style>
        body { 
            text-align: center; 
            font-family: sans-serif; 
            background-color: #f3f3f3;
            padding-top: 50px;
        }
        button { 
            padding: 15px 30px; 
            font-size: 20px; 
            background-color: #0088cc; 
            color: white; 
            border: none; 
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>မင်္ဂလာပါ Telegram Game မှ</h1>
    <p>ရမှတ်: <span id="score">0</span></p>
    <button onclick="updateScore()">နှိပ်ပါ</button>

    <script>
        let score = 0;
        function updateScore() {
            score++;
            document.getElementById('score').innerText = score;
        }
    </script>
</body>
</html>
